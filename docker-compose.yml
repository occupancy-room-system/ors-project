services:
  # ============================================================================
  # 1. MySQL 8 Database Service
  # ============================================================================
  ors-db:
    image: mysql:8.4
    container_name: ors-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ors2026}
      MYSQL_DATABASE: ${DB_NAME:-orsdb}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ors-infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ors2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ors-network

  # ============================================================================
  # 2. Spring Boot Backend API Service
  # ============================================================================
  ors-server:
    build:
      context: ./ors-server
      dockerfile: Dockerfile
    image: ors-server:latest
    container_name: ors-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ors-db:3306/${DB_NAME:-orsdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD:-ors2026}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SERVER_PORT: 8080
    depends_on:
      ors-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - ors-network

  # ============================================================================
  # 3. Next.js Frontend Web Application Service
  # ============================================================================
  ors-frontend:
    build:
      context: ./ors-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_API: ${NEXT_PUBLIC_BASE_API:-http://localhost:8080}
    image: ors-frontend:latest
    container_name: ors-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://ors-server:8080
      PORT: 3000
    depends_on:
      ors-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - ors-network

volumes:
  mysql_data:
    driver: local

networks:
  ors-network:
    driver: bridge

