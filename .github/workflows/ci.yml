name: ORS Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI: Java 21, Maven, Tests & Packaging
  # ============================================================================
  backend:
    name: Backend CI (Spring Boot 3.4 & Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        working-directory: ./ors-server
        run: mvn test --batch-mode

      - name: Build Spring Boot JAR Package
        working-directory: ./ors-server
        run: mvn package -DskipTests --batch-mode

  # ============================================================================
  # 2. Frontend CI: Node.js 20, Next.js 16 & TypeScript Build
  # ============================================================================
  frontend:
    name: Frontend CI (Next.js 16 & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./ors-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./ors-frontend
        run: npm ci

      - name: Build Next.js Web Application
        working-directory: ./ors-frontend
        run: npm run build

  # ============================================================================
  # 3. Infrastructure CI: Docker Compose & SQL Init Validation
  # ============================================================================
  infra:
    name: Infrastructure CI (Docker Compose & DB Init)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f ors-infra/docker-compose.yml config

      - name: Verify SQL Initialization Script Exists
        run: |
          if [ ! -f ors-infra/init/01-init.sql ]; then
            echo "::error::ors-infra/init/01-init.sql is missing!"
            exit 1
          fi
          echo "SQL Initialization script verified successfully."

