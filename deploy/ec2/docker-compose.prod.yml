# ==============================================================================
# Docker Compose for EC2 Production Deployment
# Uses pre-built images from a private Docker registry (no local build)
# ==============================================================================

services:
  # ============================================================================
  # 1. MySQL 8 Database Service
  # ============================================================================
  ors-db:
    image: mysql:8.4
    container_name: ors-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ors2026}
      MYSQL_DATABASE: ${DB_NAME:-orsdb}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-ors2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ors-network

  # ============================================================================
  # 2. Spring Boot Backend API (pulled from private registry)
  # ============================================================================
  ors-server:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/ors:server-${IMAGE_TAG:-latest}
    container_name: ors-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://ors-db:3306/${DB_NAME:-orsdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD:-ors2026}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: 8080
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    depends_on:
      ors-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - ors-network

  # ============================================================================
  # 3. Next.js Frontend Web Application (pulled from private registry)
  # ============================================================================
  ors-frontend:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/ors:frontend-${IMAGE_TAG:-latest}
    container_name: ors-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://ors-server:8080
      PORT: 3000
    depends_on:
      ors-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - ors-network

volumes:
  mysql_data:
    driver: local

networks:
  ors-network:
    driver: bridge
